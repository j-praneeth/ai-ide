name: Build Windows Backend Only

on:
  workflow_dispatch:

jobs:
  build-windows-backend:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Windows backend
        run: |
          cd backend
          python -m PyInstaller --onefile --name nebula-backend --distpath ../dist/backend main.py --add-data "agent:agent" --add-data "relay_config.json:."
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
          RELAY_AUTO_CONNECT: ${{ secrets.RELAY_AUTO_CONNECT }}

      - name: Upload Windows backend
        uses: actions/upload-artifact@v4
        with:
          name: nebula-backend.exe
          path: dist/backend/nebula-backend.exe
          retention-days: 5